# username, database and password must match POSTGRES_USER, POSTGRES_DB and
# POSTGRES_PASSWORD in /home/onezee/profile-service/.env — nothing syncs the two.
# password comes from CONFIG_SECRETS_JSON; without it the app fails validation.
DatabaseConfig:
  host: postgres
  port: 5432
  username: profile
  database: profile
  schema: public
  poolSize: 3
  logQueries: false

WebserverConfig:
  port: 3000
  publicUrl: https://cv.onezee.dev/

GraphqlConfig:
  path: /graphql
  sandbox: true
  introspection: true
  maxDepth: 8
  responseCacheTtlSeconds: 60
  maxBodyBytes: 16384
