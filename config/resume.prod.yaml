  experience:
    - company: iMe
      position: Senior Backend Engineer
      companyUrl: https://imem.app
      location: Remote · UAE entity
      startedAt: '2021-01'
      finishedAt: '2026-06'
      summary: >-
        iMe - a crypto/fintech Telegram super-app on iOS, Android and Desktop,
        with a built-in self-custodial crypto wallet, subscription monetisation
        and an AI assistant. Dozens of NestJS microservices on Kubernetes. I
        joined as an intern in 2020, was promoted from Junior to Senior by 2023,
        and then owned core platform systems.
      achievements:
        - >-
          Designed and owned the API gateway — the single entry point for the
          iOS, Android and Desktop clients — sustaining ~700 req/sec with HA
          autoscaling, multi-tier rate limiting across 8 per-endpoint tiers and
          Redis-backed counters on a 3-shard cluster.
        - >-
          Built the subscription and payments platform integrating 8+ providers
          — Apple App Store server-to-server receipt validation, Google Play
          Billing, Stripe with gifting, Telegram Stars, YooKassa and Binance Pay
          — with the full lifecycle behind it: renewals, retry windows, refunds,
          revocations, grace periods and locale-aware notifications.
        - >-
          Architected a self-custodial multi-chain wallet across 9+ networks
          (Bitcoin, Ethereum, BSC, Polygon, Base, Arbitrum, Solana, Tron, TON)
          with BIP39/BIP44 HD derivation from a single seed, an AES-256-GCM
          vault, per-protocol transfer adapters and gas-oracle fee estimation.
        - >-
          Integrated 7+ DEX and swap routes — Uniswap V3/V4, PancakeSwap,
          1inch Fusion, Symbiosis for cross-chain, Jupiter and STON.fi — plus
          the MoonPay, Paybis and Mercuryo fiat on-ramps.
        - >-
          Shipped an AI Telegram assistant on OpenAI GPT-4 and the Assistants
          API, streaming token deltas to the client over a realtime WebSocket
          with backoff-based rate limiting.
        - >-
          Applied distributed-systems patterns across the fleet: a transactional
          outbox for guaranteed event delivery, circuit breakers on external
          JSON-RPC endpoints, durable RabbitMQ subscriptions, and structured
          YAML config compiled into typed config objects instead of environment
          sprawl.
        - >-
          Drove the migration of legacy services from NestJS 7 and TypeORM 0.2
          to NestJS 11 and TypeORM 0.3 without downtime.

