name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7

    # The default builder uses the `docker` driver, which cannot export a
    # cache. type=gha needs the `docker-container` driver this sets up.
    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ghcr.io/onezee23/profile-service:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: read
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 22.15.0
        cache: yarn

    - run: yarn install --frozen-lockfile --ignore-scripts

    - name: Render the deployment payload
      run: |
        mkdir -p payload
        node scripts/build-config.mjs --env=prod --out=payload/config.json
        cp deploy/docker-compose.prod.yml payload/docker-compose.prod.yml
      env:
        CONFIG_SECRETS_JSON: ${{ secrets.CONFIG_SECRETS_JSON }}

    - uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: payload/*
        target: /home/onezee/profile-service
        strip_components: 1
        overwrite: true

    - uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        envs: IMAGE_TAG,REGISTRY_USER,REGISTRY_TOKEN
        script: |
          set -eu
          cd /home/onezee/profile-service
          printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > .image.env
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker compose --env-file .env --env-file .image.env -f docker-compose.prod.yml pull app
          docker compose --env-file .env --env-file .image.env -f docker-compose.prod.yml up -d --remove-orphans
          docker compose --env-file .env --env-file .image.env -f docker-compose.prod.yml up -d --force-recreate app
          docker image prune -f
      env:
        IMAGE_TAG: ${{ github.sha }}
        REGISTRY_USER: ${{ github.actor }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
