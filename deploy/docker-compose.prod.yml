# profile-service — app + postgres + a Cloudflare Tunnel.
#
# No inbound ports are published. cloudflared reaches app:3000 from inside this
# compose network, so a 443 passthrough already on the box is untouched.
#
#   First run:  cp .env.example .env      # TUNNEL_TOKEN, POSTGRES_PASSWORD
#               printf 'IMAGE_TAG=<commit sha>\n' > .image.env   # only sha tags are pushed
#               docker compose --env-file .env --env-file .image.env \
#                 -f docker-compose.prod.yml up -d
#   Update:     handled by .github/workflows/deploy.yml
#   Logs:       docker compose -f docker-compose.prod.yml logs -f app

name: profile-service-prod

services:

  app:
    image: ghcr.io/onezee23/profile-service:${IMAGE_TAG:?set IMAGE_TAG in .env or .image.env}
    restart: unless-stopped
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
    - /tmp
    mem_limit: 192m
    cpus: 0.75
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      TZ: UTC
      LOG_LEVEL: log,warn,error,fatal
      CONFIG_JSON_PATH: /etc/backend/config.json
      LOCALIZATION_YAML_PATH: assets/localization.yaml
    volumes:
    - ./config.json:/etc/backend/config.json:ro
    expose:
    - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health/check').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
    - postgres
    - -c
    - shared_buffers=32MB
    - -c
    - effective_cache_size=96MB
    - -c
    - work_mem=2MB
    - -c
    - maintenance_work_mem=32MB
    - -c
    - max_connections=20
    - -c
    - wal_buffers=1MB
    - -c
    - min_wal_size=64MB
    - -c
    - max_wal_size=256MB
    - -c
    - log_min_duration_statement=500
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      TZ: UTC
    volumes:
    - pgdata:/var/lib/postgresql/data
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    shm_size: 64m
    mem_limit: 160m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  cloudflared:
    image: cloudflare/cloudflared:2026.9.0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
      TZ: UTC
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
    - /tmp
    mem_limit: 48m
    cpus: 0.25
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
